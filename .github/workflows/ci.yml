name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        # --all-features also checks the picture helper of the window, which a
        # release build leaves out.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit and fake-server tests
        run: cargo test --workspace --locked

  integration:
    name: Real OpenVPN server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenVPN
        run: sudo apt-get update && sudo apt-get install -y openvpn
      - name: Allow unprivileged network namespaces
        # Ubuntu 24.04 blocks them by default through AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Integration test
        run: tests/integration/run.sh
