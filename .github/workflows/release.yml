name: Release

# Runs when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=ovpn-otp-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/ovpn-otp target/${{ matrix.target }}/release/ovpn-otp-gui dist/$name/
          cp README.md LICENSE examples/settings.toml dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ovpn-otp-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ovpn-otp.exe", "target/${{ matrix.target }}/release/ovpn-otp-gui.exe", README.md, LICENSE, examples/settings.toml "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
