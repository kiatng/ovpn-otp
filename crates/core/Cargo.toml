[package]
name = "ovpn-otp-core"
description = "Drive OpenVPN through its management interface with a saved login and a separate one-time code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
directories.workspace = true
rand.workspace = true
reqwest.workspace = true
sha2.workspace = true
semver.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[dev-dependencies]
ovpn-otp-testkit.workspace = true
tempfile.workspace = true
