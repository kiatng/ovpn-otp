[package]
name = "ovpn-otp"
description = "Command-line client for OpenVPN servers that want a one-time code appended to the password"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ovpn-otp"
path = "src/main.rs"

[dependencies]
ovpn-otp-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# "termination": SIGTERM and SIGHUP stop the session like Ctrl+C does, so that
# OpenVPN is not left running when a background session is told to end.
ctrlc = { version = "3", features = ["termination"] }
rpassword.workspace = true
serde_json.workspace = true

[dev-dependencies]
ovpn-otp-testkit.workspace = true
tempfile.workspace = true
