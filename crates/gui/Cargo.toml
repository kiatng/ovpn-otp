[package]
name = "ovpn-otp-gui"
description = "Desktop window for OpenVPN servers that want a one-time code appended to the password"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ovpn-otp-gui"
path = "src/main.rs"

[dependencies]
ovpn-otp-core.workspace = true
chrono.workspace = true
eframe.workspace = true
rfd = "0.15"
# Only for the `screenshots` feature. eframe already brings this crate in.
png = { version = "0.18", optional = true }

# The system-tray icon and its menu (Windows; on Linux the window closes
# as before, since a tray there would pull in the GTK stack).
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[features]
diagnostic-test = ["ovpn-otp-core/diagnostic-test"]
# Lets the window save a picture of itself, for the README (see src/shot.rs).
# Not turned on in a release build.
screenshots = ["dep:png"]
