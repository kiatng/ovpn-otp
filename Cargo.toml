[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui", "crates/testkit"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/kiatng/ovpn-otp"

[workspace.dependencies]
ovpn-otp-core = { path = "crates/core" }
ovpn-otp-testkit = { path = "crates/testkit" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
keyring = { version = "3.6", default-features = false }
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
